name: Build Android APK

# Builds the Bazaar Daketee Android app entirely on GitHub's own servers —
# no local Android Studio or disk space needed. Triggers automatically on
# every push to main/master, and can also be run manually from the Actions
# tab (the "Run workflow" button) via workflow_dispatch.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 7's Android library compiles against Java 21 (its Gradle
      # config sets sourceCompatibility 21) — the JDK running Gradle has to
      # be at least that new, or javac rejects it with "invalid source
      # release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --ignore-scripts: the server workspace's postinstall runs
      # `prisma generate && prisma migrate deploy`, which needs a real
      # database — irrelevant here, this job never touches the server.
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build shared package (client depends on its compiled output)
        run: npm run build --workspace=shared

      - name: Build the client for Capacitor (no PWA service worker)
        # Baked into the app at build time — where the installed app looks
        # for its server. Change this if the server ever moves.
        env:
          VITE_SERVER_URL: https://api.easycashpk.com
        run: npm run build:capacitor --workspace=client

      - name: Sync the built web app into the Android project
        working-directory: client
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bazaar-daketee-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
